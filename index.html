<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style/style.css">
  <link rel="stylesheet" href="style/normalize.css">

  <title>Frontend Mentor | Results summary component</title>
</head>
<body>
  <div class="container">
    <div class="result-box">
      <div class="result-card">
        <h2 class="result-title">Your Result</h2>
        <div class="result-circle">
          <p class="result-score">76</p>
          <span class="result-score-of">of 100</span>
        </div>
        <div class="result-card-message">
          <p class="result-card-message-title">Great</p>
          <p class="result-card-message-text">
            You scored higher than 65% of <br> the people who have taken <br> these tests.
          </p>
        </div>
      </div>
      <div class="summary-card">
        <h2 class="summary-card-heading">Summary</h2>
        <ul class="summary-card-status">
          <li class="status-item-reaction">Reaction
            80 / 100
          </li>
          <li class="status-item-memory">Memory
            92 / 100
          </li>
          <li class="status-item-verbal">Verbal
            61 / 100
          </li>
          <li class="status-item-visual">Visual
            72 / 100
          </li>
        </ul>
        <button class="continue-btn">Continue</button>
      </div>
    </div>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Azimjonov Islomjon</a>.
  </footer>
  </div>

  <!-- javascript  -->
  <script src="js/data.json">

  </script>
</body>
</html>
