<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style/style.css">
  <link rel="stylesheet" href="style/normalize.css">

  <title>Frontend Mentor | Results summary component</title>
</head>
<body>
  <div class="container">
    <div class="result-box">
      <div class="result-card">
        <h2 class="result-title">Your Result</h2>
        <div class="result-circle">
          <div class="for-center">
            <p class="result-score">76</p>
            <span class="result-score-of">of 100</span>
          </div>
        </div>
        <div class="result-card-message">
          <p class="result-card-message-title">Great</p>
          <p class="result-card-message-text">
            You scored higher than 65% of  the people who have taken these tests.
          </p>
        </div>
      </div>
      <div class="summary-card">
        <div class="summary-wrapper">
          <h2 class="summary-card-heading">Summary</h2>
          <ul class="summary-card-status">
            <li class="status-item status-item-reaction">
              <img class="status-item-icon" src="" alt="" width="20px" height="20px" aria-hidden="true">
              <span class="status-item-title status-item-title-color-red"></span>
              <span class="status-item-result"></span>
              <span class="status-item-percent-label">%</span>
              <span class="status-item-max">/ 100</span>
            </li>
            <li class="status-item status-item-memory">
              <img class="status-item-icon" src="" alt="" width="20px" height="20px" aria-hidden="true">
              <span class="status-item-title status-item-title-color-orange"></span>
              <span class="status-item-result"></span>
              <span class="status-item-percent-label">%</span>
              <span class="status-item-max">/ 100</span>
            </li>
            <li class="status-item status-item-verbal">
              <img class="status-item-icon" src="" alt="" width="20px" height="20px" aria-hidden="true">
              <span class="status-item-title status-item-title-color-green"></span>
              <span class="status-item-result"></span>
              <span class="status-item-percent-label">%</span>
              <span class="status-item-max">/ 100</span>
            </li>
            <li class="status-item status-item-visual">
              <img class="status-item-icon" src="" alt="" width="20px" height="20px" aria-hidden="true">
              <span class="status-item-title status-item-title-color-blue"></span>
              <span class="status-item-result"></span>
              <span class="status-item-percent-label">%</span>
              <span class="status-item-max">/ 100</span>
            </li>
          </ul>
          <button class="continue-btn">Continue</button>
        </div>
      </div>
    </div>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Azimjonov Islomjon</a>.
  </footer>
  </div>

  <!-- javascript  -->
  <script src="js/main.js">

  </script>
</body>
</html>
