<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style/style.css">
  <link rel="stylesheet" href="style/normalize.css">

  <title>Frontend Mentor | Results summary component</title>
</head>
<body>
  <div class="container">
    <div class="result-box">
      <div class="result-card">
        <h2 class="result-title">Your Result</h2>
        <div class="result-circle">
          <p class="result-score">76</p>
          <span class="result-score-of">of 100</span>
        </div>
        <div class="result-card-message">
          <p class="result-card-message-title">Great</p>
          <p class="result-card-message-text">
            You scored higher than 65% of <br> the people who have taken <br> these tests.
          </p>
        </div>
      </div>
      <div class="summary-card">
        <h2 class="summary-card-heading">Summary</h2>
        
        Reaction
        80 / 100

        Memory
        92 / 100

        Verbal
        61 / 100

        Visual
        72 / 100

        Continue
      </div>
    </div>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Azimjonov Islomjon</a>.
  </footer>
  </div>

  <!-- javascript  -->
  <script src="js/data.json">

  </script>
</body>
</html>
